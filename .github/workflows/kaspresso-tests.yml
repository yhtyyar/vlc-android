name: Kaspresso tests

on:
  push:
    branches: [ test/kaspresso-framework ]
  pull_request:
    branches: [ test/kaspresso-framework ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch libvlcjni (JNI glue sources only, pinned; no native build needed for this check)
        run: |
          git clone --single-branch --branch libvlcjni-3.x https://code.videolan.org/videolan/libvlcjni.git
          git -C libvlcjni reset --hard 08cbcce16a2f2cf9ca64f253cc8688d8b55a97da

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Compiles org.videolan.vlc.kaspresso.* alongside the existing Espresso suite.
      - name: Compile the Kaspresso androidTest sources
        run: gradle :application:app:compileDebugAndroidTestKotlin --console=plain

  instrumented-tests:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch libvlcjni (JNI glue sources only, pinned; no native build needed for this job)
        run: |
          git clone --single-branch --branch libvlcjni-3.x https://code.videolan.org/videolan/libvlcjni.git
          git -C libvlcjni reset --hard 08cbcce16a2f2cf9ca64f253cc8688d8b55a97da

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Scoped to org.videolan.vlc.kaspresso.* only — the existing Espresso suite has its own
      # coverage and CI story and isn't the concern of this workflow.
      #
      # VideoPlaybackTest/AudioPlaybackTest push real, small, checked-in sample media
      # (application/app/src/androidTest/assets/media/, via TestMediaProvider) before each test,
      # so they exercise real playback rather than skip. The Assume check in each is a defensive
      # fallback in case the push/rescan doesn't land in time on a given runner. See ANALYSIS.md
      # §8-9 for how these fixtures were chosen and the real bugs found running this suite for
      # real (this workflow itself hasn't been run in real CI yet — see §9's closing note).
      - name: Run the Kaspresso instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          script: >
            gradle :application:app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.package=org.videolan.vlc.kaspresso
            --console=plain

      # NOTE (unverified — no emulator available while authoring this workflow): allure-kotlin-android
      # writes results on-device rather than to the host filesystem. This path follows Allure Kotlin's
      # documented convention (externalFilesDir/allure-results); confirm it on the first real run and
      # adjust if KaspressoConfig's withAllureSupport() resolves a different directory.
      - name: Pull Allure results off the device
        if: always()
        run: |
          adb pull /sdcard/Android/data/org.videolan.vlc.debug/files/allure-results ./allure-results || true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 30
          if-no-files-found: warn
